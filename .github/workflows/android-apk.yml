
name: Build VAMPS MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vamps-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract and Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and validate source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for FILE in \
            "VAMPS_MUSIC_FIXED.zip" \
            "VAMPS_MUSIC_SOURCE.zip" \
            "source.zip"
          do
            if [ -s "$FILE" ]; then
              ZIP="$FILE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            mapfile -d '' FILES < <(
              find . -maxdepth 3 -type f \
                -iname '*.zip' \
                ! -path './.git/*' \
                -print0
            )

            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "::error::Could not uniquely locate source ZIP."
              find . -maxdepth 3 -type f
              exit 1
            fi

            ZIP="${FILES[0]}"
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

          echo "Source ZIP: $ZIP"

          unzip -t "$ZIP"

      - name: Extract and detect Android project
        id: project
        shell: bash
        env:
          ZIP_PATH: ${{ steps.source.outputs.zip }}
        run: |
          set -euo pipefail

          mkdir -p extracted

          unzip -q "$ZIP_PATH" -d extracted

          echo "Extracted archive contents:"
          find extracted -maxdepth 5 -type f | head -200

          PROJECT=""

          while IFS= read -r -d '' SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if {
              [ -f "$DIR/app/build.gradle.kts" ] ||
              [ -f "$DIR/app/build.gradle" ]
            } && [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT="$DIR"
              break
            fi

          done < <(
            find extracted -type f \
              \( -name settings.gradle.kts \
              -o -name settings.gradle \) \
              -print0
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Android Gradle project not found."

            find extracted -type f

            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          RELATIVE_PROJECT="$(
            realpath --relative-to="$GITHUB_WORKSPACE" "$PROJECT"
          )"

          echo "project=$RELATIVE_PROJECT" >> "$GITHUB_OUTPUT"

          echo "Detected project: $RELATIVE_PROJECT"

          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/gradle.properties"

          if [ ! -f "$PROJECT/settings.gradle.kts" ] &&
             [ ! -f "$PROJECT/settings.gradle" ]; then
            echo "::error::Missing settings.gradle"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Missing app Gradle configuration"
            exit 1
          fi

          echo "Project structure verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

          echo "Android SDK installation completed."

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Build environment verified."

      - name: Validate Gradle project
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            help

      - name: Build Debug and Release APKs
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Verify APK outputs
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project }}
        run: |
          set -euo pipefail

          DEBUG="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          RELEASE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$DEBUG"
          test -s "$RELEASE"

          mkdir -p final-apks

          cp "$DEBUG" final-apks/VAMPS-MUSIC-debug.apk

          cp "$RELEASE" final-apks/VAMPS-MUSIC-release.apk

          echo "APK verification successful."

          ls -lh final-apks/

          sha256sum final-apks/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VAMPS-MUSIC-APKs
          path: final-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Collect build diagnostics
        if: always()
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          mkdir -p diagnostics

          if [ -n "$PROJECT_DIR" ] &&
             [ -d "$PROJECT_DIR/app/build/reports" ]; then
            cp -r "$PROJECT_DIR/app/build/reports" diagnostics/
          fi

          if [ -n "$PROJECT_DIR" ] &&
             [ -d "$PROJECT_DIR/app/build/outputs/logs" ]; then
            cp -r "$PROJECT_DIR/app/build/outputs/logs" diagnostics/
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VAMPS-MUSIC-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
